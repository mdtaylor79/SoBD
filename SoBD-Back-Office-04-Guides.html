<style>
/* SoBD Brand Guidelines v2 tokens */
:root{
  --eartha:#C2431A; --eartha-dk:#9C3615; --golden:#B98B1E; --flora:#34461D; --flora-2:#6B7F4A;
  --blackish:#1A1A1A; --ink-2:#3A3A36; --ink-3:#5C5A52; --stone:#8A8A80; --rule:#CFCAB4; --rule-2:#E4E0CF;
  --yella:#F6F2E0; --yella-2:#EFEAD3; --white:#FFFFFF;
  --t-eartha:#F3D9CF; --t-flora:#DFE4D2; --t-golden:#F0E3BC; --t-neutral:#EFEAD3;
  --hero:'Bebas Neue','Arial Narrow',sans-serif;
  --display:'Playfair Display',Cambria,Georgia,serif;
  --text:'Source Serif 4',Cambria,Georgia,serif;
  --radius:14px; --shadow:5px 5px 0 var(--blackish);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--yella);color:var(--blackish);font-family:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--eartha);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* concept strip + top bar */
.concept{background:var(--flora);color:var(--yella);text-align:center;font-size:14px;padding:6px 14px}
.topbar{background:var(--blackish);color:var(--yella);position:sticky;top:0;z-index:50}
.topbar .in{max-width:1360px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:22px}
.topbar .mono img{height:34px;display:block}
.topbar .app{font-family:var(--hero);font-size:24px;letter-spacing:.04em;line-height:1;color:var(--yella);white-space:nowrap}
.topbar .app span{color:var(--golden)}
.gsearch{flex:1;max-width:560px;position:relative}
.gsearch input{width:100%;background:#262624;border:1px solid #3A3A36;border-radius:999px;padding:10px 16px 10px 42px;color:var(--yella);font-size:15px}
.gsearch input::placeholder{color:#A7A394}
.gsearch .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#A7A394}
.gresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--white);color:var(--blackish);border:2px solid var(--blackish);border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow:auto;display:none}
.gresults.on{display:block}
.gresults .grp{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--eartha-dk);padding:12px 16px 4px}
.gresults button{display:flex;gap:12px;width:100%;text-align:left;padding:9px 16px;align-items:center}
.gresults button:hover,.gresults button:focus{background:var(--yella-2)}
.gresults small{color:var(--ink-3);display:block;font-size:13px}
.tb-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--yella);position:relative}
.iconbtn:hover{background:#2A2A28}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--eartha);border:2px solid var(--blackish)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--golden);color:var(--blackish);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:none}
.menu-btn{display:none}
.notif{position:absolute;right:28px;top:60px;width:360px;background:var(--white);color:var(--blackish);border:2px solid var(--blackish);border-radius:12px;box-shadow:var(--shadow);display:none;z-index:60}
.notif.on{display:block}
.notif h4{font-family:var(--display);padding:14px 16px;border-bottom:1px solid var(--rule-2)}
.notif li{list-style:none;padding:12px 16px;border-bottom:1px solid var(--rule-2);font-size:14px}
.notif li small{display:block;color:var(--ink-3)}

/* hero */
.hero{background:var(--blackish);color:var(--yella);position:relative;overflow:hidden}
.hero .in{max-width:1360px;margin:0 auto;padding:40px 28px 44px;position:relative;z-index:1}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.hero .eyebrow{color:var(--golden)}
.hero h1{font-family:var(--hero);font-weight:400;font-size:clamp(52px,6vw,84px);line-height:.95;letter-spacing:.01em;margin:8px 0 6px}
.hero p{color:#D9D4C0;font-size:17px}
.hero .role{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--golden);text-transform:uppercase}
.hero-shapes{position:absolute;right:0;top:0;bottom:0;width:46%;pointer-events:none}
.hero-shapes svg{position:absolute;right:28px;bottom:0;height:100%;width:auto}
.slogan{position:absolute;right:28px;top:36px;text-align:right;font-family:var(--hero);font-size:26px;line-height:1.05;z-index:2}
.slogan span{display:block}
.slogan .g{color:#6E6C64}.slogan .e{color:var(--eartha)}

/* page header (non-overview) */
.phead{background:var(--blackish);color:var(--yella)}
.phead .in{max-width:1360px;margin:0 auto;padding:26px 28px 28px;display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.phead .eyebrow{color:var(--golden)}
.phead h1{font-family:var(--hero);font-weight:400;font-size:clamp(42px,5vw,64px);line-height:.95;margin-top:6px}
.crumbs{font-size:14px;color:#BDB8A6;margin-top:6px}
.crumbs a{color:var(--yella);text-decoration:underline}

/* layout */
.shell{max-width:1360px;margin:0 auto;padding:32px 28px 64px;display:grid;grid-template-columns:262px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:84px;background:var(--white);border:2px solid var(--blackish);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.side .sh{background:var(--blackish);color:var(--golden);padding:14px 18px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.side .sh img{height:22px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 18px;text-decoration:none;font-size:16px;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.side nav a:hover{background:var(--yella)}
.side nav a[aria-current=page]{background:var(--eartha);color:var(--white);font-weight:600;border-bottom-color:var(--eartha)}
.side nav a .cnt{margin-left:auto;font-size:12px;font-family:var(--display);font-weight:700;background:var(--t-eartha);color:var(--eartha-dk);border-radius:999px;padding:1px 8px}
.side nav a[aria-current=page] .cnt{background:var(--white);color:var(--eartha-dk)}
.side .sep{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:14px 18px 6px;border-bottom:1px solid var(--rule-2);background:var(--yella)}
.storage{padding:16px 18px;border-bottom:1px solid var(--rule-2);font-size:14px}
.meter{height:8px;border-radius:4px;background:var(--yella-2);border:1px solid var(--rule);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--flora)}
.help{display:flex;gap:12px;align-items:center;padding:16px 18px;font-size:14px}
.help .ic{width:40px;height:40px;border-radius:50%;background:var(--yella-2);display:grid;place-items:center;color:var(--eartha);flex:none}
.help b{display:block;font-family:var(--display)}

/* common UI */
.card{background:var(--white);border:2px solid var(--blackish);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1.5px solid var(--rule-2)}
.card-h h2,.card-h h3{font-family:var(--display);font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}
.card-h h2 .i{color:var(--eartha)}
.card-b{padding:18px 20px}
.link{color:var(--eartha-dk);font-family:var(--display);font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border-radius:999px;border:2px solid var(--blackish);transition:transform .12s, box-shadow .12s;white-space:nowrap}
.btn-p{background:var(--eartha);color:var(--white);border-color:var(--eartha)}
.btn-p:hover{background:var(--eartha-dk);border-color:var(--eartha-dk)}
.btn-o{background:var(--white);color:var(--blackish)}

<script>
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ic=(n,cls='i')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const rel=n=>{const d=new Date(TODAY.getTime()+n*DAY);return d.toISOString().slice(0,10)};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=(s,o={month:'short',day:'numeric'})=>parse(s).toLocaleDateString('en-US',o);
const fmtY=s=>fmt(s,{month:'short',day:'numeric',year:'numeric'});
const daysTo=s=>Math.round((parse(s)-TODAY)/DAY);
const dueLabel=s=>{const n=daysTo(s);return n<0?`<span class="overdue">${-n}d overdue</span>`:n===0?'<span class="overdue">Due today</span>':n===1?'Due tomorrow':n<7?`Due in ${n} days`:'Due '+fmt(s)};
const uid=()=>Math.random().toString(36).slice(2,9);
const sizeFmt=b=>b>1e9?(b/1e9).toFixed(1)+' GB':b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
let tTimer; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('on'),2400)}

/* ============ seed data (sample) ============ */
const TEAM=[
 {id:'ab',name:'Avery Brooks',role:'Programs Lead',area:'Conference & events'},
 {id:'do',name:'Dana Okafor',role:'Partnerships Manager',area:'Sponsors & co-branding'},
 {id:'km',name:'Kofi Mensah',role:'Design Lead',area:'Brand, templates, merch'},
 {id:'tr',name:'Tasha Rivers',role:'Communications',area:'Social, press, newsletter'},
 {id:'jh',name:'Jordan Hollis',role:'Operations',area:'Finance, grants, logistics'},
 {id:'np',name:'Nia Pryor',role:'Community Programs',area:'Community Reads, Standard Bearers'}
];
const STATUS=[['todo','To do'],['doing','In progress'],['review','In review'],['done','Done']];
const PCOL={eartha:'#C2431A',golden:'#B98B1E',flora:'#34461D',blackish:'#1A1A1A',earthaDk:'#9C3615',flora2:'#6B7F4A'};
function seed(){
  const T=(title,status,who,due,tag,pri='Normal')=>({id:uid(),title,status,who,due:rel(due),tag,pri,notes:''});
  return {

    <h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
    <div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>${p.tasks.filter(t=>t.status==='done').length} of ${p.tasks.length} tasks</span><b>${prog(p)}%</b></div><div class="progress"><i style="width:${prog(p)}%"></i></div></div>
    <div class="pf"><div class="avs">${[...new Set(p.tasks.map(t=>t.who))].slice(0,5).map(w=>av(w)).join('')}</div><span>Lead: ${esc(person(p.lead).name)}</span></div></div></a>`).join('')}</div>`
  :`<div class="card" style="overflow:auto"><table class="ptable"><thead><tr><th>Project</th><th>Lead</th><th>Status</th><th>Progress</th><th>Next milestone</th><th>Ends</th></tr></thead><tbody>
    ${ps.map(p=>{const nm=p.milestones.find(m=>!m.done);return `<tr data-href="#/projects/${p.id}"><td><b style="display:flex;gap:10px;align-items:center"><span style="width:10px;height:28px;border-radius:3px;background:${PCOL[p.color]}"></span>${esc(p.name)}</b></td><td>${esc(person(p.lead).name)}</td><td>${statusPill(p.status)}</td><td style="min-width:140px"><div class="progress"><i style="width:${prog(p)}%"></i></div><small class="muted">${prog(p)}%</small></td><td>${nm?esc(nm.t)+'<br><small class="muted">'+fmt(nm.d)+'</small>':'—'}</td><td>${fmtY(p.end)}</td></tr>`}).join('')}

let pTab='board', dragId=null;
function vProject(id){
  const p=S.projects.find(x=>x.id===id); if(!p){location.hash='#/projects';return}
  pageHead('Project',esc(p.name),`<a href="#/projects">Projects</a> / ${esc(p.name)}`,`<button class="btn btn-y" data-act="newTask" data-pid="${p.id}">${ic('plus')}Add task</button>`);
  const files=S.files.filter(f=>f.folder===p.folder);
  $('#view').innerHTML=`
  <div class="proj-top">
    <div class="card"><div class="card-b"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">${statusPill(p.status)}<select class="field sq" style="padding:4px 10px;font-size:14px" aria-label="Project status" data-pstatus="${p.id}">${['On track','At risk','Needs attention','Complete'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></div>
      <p style="font-size:17px">${esc(p.desc)}</p></div>
      <div class="facts"><div><small>Lead</small><b>${esc(person(p.lead).name)}</b></div><div><small>Timeline</small><b>${fmt(p.start)} – ${fmtY(p.end)}</b></div><div><small>Tasks</small><b>${p.tasks.filter(t=>t.status==='done').length} / ${p.tasks.length} done</b></div><div><small>Progress</small><b>${prog(p)}%</b><div class="progress" style="margin-top:6px"><i style="width:${prog(p)}%"></i></div></div></div></div>
    <div class="card"><div class="card-h"><h3>Milestones</h3><button class="link" data-act="newMs" data-pid="${p.id}">${ic('plus')}Add</button></div><div class="card-b" style="padding-top:0;padding-bottom:6px"><ul class="tl">
      ${p.milestones.map((m,i)=>`<li><button class="d ${m.done?'done':''}" aria-label="Toggle milestone ${esc(m.t)}" data-ms="${p.id}|${i}"></button><div><b style="font-weight:600">${esc(m.t)}</b></div><small class="muted">${fmt(m.d)}</small></li>`).join('')}
    </ul></div></div>
  </div>
  <div class="tabs" role="tablist">${[['board','Board'],['list','Task list'],['files',`Files (${files.length})`]].map(([k,l])=>`<button role="tab" aria-selected="${pTab===k}" data-ptab="${k}">${l}</button>`).join('')}</div>
  <div id="ptab"></div>`;
  const box=$('#ptab');
  if(pTab==='board'){
    box.innerHTML=`<div class="board">${STATUS.map(([k,l])=>{const ts=p.tasks.filter(t=>t.status===k);return `<div class="col" data-col="${k}"><h4>${l}<span class="n">${ts.length}</span></h4><div class="drop">
      ${ts.map(t=>`<div class="kcard" draggable="true" data-tid="${t.id}" tabindex="0" aria-label="${esc(t.title)}"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill n">${esc(t.tag)}</span>${t.pri==='High'?'<span class="pill e">High</span>':''}</div><b>${esc(t.title)}</b><div class="kf"><span>${k==='done'?'Done':dueLabel(t.due)}</span>${av(t.who)}</div></div>`).join('')}
      <button class="addcard" data-act="newTask" data-pid="${p.id}" data-st="${k}">+ Add task</button></div></div>`}).join('')}</div>`;
    $$('.kcard').forEach(c=>{
      c.addEventListener('dragstart',e=>{dragId=c.dataset.tid;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
      c.addEventListener('dragend',()=>c.classList.remove('dragging'));
      c.addEventListener('click',()=>taskModal(p.id,c.dataset.tid));
      c.addEventListener('keydown',e=>{if(e.key==='Enter')taskModal(p.id,c.dataset.tid)});
    });
    $$('.col').forEach(col=>{
      col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
      col.addEventListener('dragleave',()=>col.classList.remove('over'));
      col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const t=p.tasks.find(x=>x.id===(dragId||e.dataTransfer.getData('text/plain')));if(t&&t.status!==col.dataset.col){t.status=col.dataset.col;logAct('me',`moved to ${STATUS.find(s=>s[0]===t.status)[1]}:`,t.title);save();route();toast('Moved to '+STATUS.find(s=>s[0]===t.status)[1])}});
    });
  } else if(pTab==='list'){
    const ts=[...p.tasks].sort((a,b)=>(a.status==='done')-(b.status==='done')||a.due.localeCompare(b.due));
    box.innerHTML=`<div class="card" style="overflow:auto"><table class="ptable"><thead><tr><th style="width:44px"></th><th>Task</th><th>Owner</th><th>Status</th><th>Due</th><th>Tag</th></tr></thead><tbody>
      ${ts.map(t=>`<tr data-task="${p.id}|${t.id}"><td><button class="chk" role="checkbox" aria-checked="${t.status==='done'}" aria-label="Mark done" data-toggle="${p.id}|${t.id}">${t.status==='done'?ic('check'):''}</button></td><td><b style="font-weight:600;${t.status==='done'?'text-decoration:line-through;color:var(--stone)':''}">${esc(t.title)}</b>${t.pri==='High'?' <span class="pill e">High</span>':''}</td><td><span style="display:flex;gap:8px;align-items:center">${av(t.who)}${esc(person(t.who).name)}</span></td><td><span class="pill ${t.status==='done'?'f':t.status==='review'?'g':t.status==='doing'?'e':'n'}">${STATUS.find(s=>s[0]===t.status)[1]}</span></td><td>${t.status==='done'?fmt(t.due):dueLabel(t.due)}</td><td>${esc(t.tag)}</td></tr>`).join('')}
    </tbody></table></div>`;
  } else {
    box.innerHTML=files.length?`<div class="card" style="overflow:auto">${fileTable(files,true)}</div><p class="muted" style="margin-top:10px;font-size:14px">Linked collection: <a class="link" href="#/library/${p.folder}">${esc(folderById(p.folder).name)}</a></p>`:'<div class="empty"><b>No linked files</b></div>';
  }
}

/* ============ LIBRARY ============ */
let libQ='', libType='all', libStatus='all', libSort='updated', libView='folders';
function vLibrary(folderId){
  const f=folderId&&folderById(folderId);
  if(folderId&&!f){location.hash='#/library';return}
  pageHead('Knowledge management',f?esc(f.name):'Knowledge Library',f?`<a href="#/library">Knowledge Library</a> / ${esc(f.name)}`:'',
    `<button class="btn btn-y" data-act="upload">${ic('upload')}Upload</button>${f?'':`<button class="btn btn-o" style="border-color:var(--yella)" data-act="newFolder">${ic('plus')}New collection</button>`}`);
  let list=S.files.filter(x=>!f||x.folder===f.id);
  const showFolders=!f&&libView==='folders'&&!libQ&&libType==='all'&&libStatus==='all';
  if(libQ){const q=libQ.toLowerCase();list=list.filter(x=>x.name.toLowerCase().includes(q)||x.tags.join(' ').toLowerCase().includes(q))}
  if(libType!=='all')list=list.filter(x=>typeGroup(x.name)===libType);
  if(libStatus==='fav')list=list.filter(x=>x.fav); else if(libStatus!=='all')list=list.filter(x=>x.status===libStatus);
  list.sort(libSort==='name'?(a,b)=>a.name.localeCompare(b.name):libSort==='size'?(a,b)=>b.size-a.size:(a,b)=>b.updated.localeCompare(a.updated));
  const recent=[...S.files].sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,4);
  $('#view').innerHTML=`
  <div class="dropzone" id="dz">${ic('upload')}<div><b>Drop files here</b> to add them to ${f?esc(f.name):'the library'}</div><div class="muted" style="font-size:14px">or <button class="link" data-act="upload">browse your computer</button> · files stay in this browser session for the mockup</div></div>
  <div class="toolbar">
    <input class="field" style="flex:1;min-width:220px" type="search" placeholder="Search file names and tags" value="${esc(libQ)}" id="libQ" aria-label="Search files">
    <select class="field" id="libType" aria-label="File type">${[['all','All types'],['doc','Documents'],['deck','Decks'],['sheet','Spreadsheets'],['image','Images & design'],['archive','Archives']].map(([k,l])=>`<option value="${k}" ${libType===k?'selected':''}>${l}</option>`).join('')}</select>
    <select class="field" id="libStatus" aria-label="Status">${[['all','Any status'],['Pre-approved','Pre-approved'],['Needs review','Needs review'],['Draft','Draft'],['Archived','Archived'],['fav','Starred']].map(([k,l])=>`<option value="${k}" ${libStatus===k?'selected':''}>${l}</option>`).join('')}</select>
    <select class="field" id="libSort" aria-label="Sort">${[['updated','Recently updated'],['name','Name A–Z'],['size','Largest first']].map(([k,l])=>`<option value="${k}" ${libSort===k?'selected':''}>${l}</option>`).join('')}</select>
    ${f?'':`<div class="seg" role="group" aria-label="Layout"><button aria-pressed="${libView==='folders'}" data-lv="folders">${ic('grid')}Collections</button><button aria-pressed="${libView==='files'}" data-lv="files">${ic('list')}All files</button></div>`}
  </div>
  ${showFolders?`
    <div class="sec-t" style="font-size:20px">Recently updated</div>
    <div class="recent-row">${recent.map(x=>`<button class="rfile" data-file="${x.id}">${ftype(x.name)}<div style="min-width:0"><b>${esc(x.name)}</b><small>${fmt(x.updated)} · ${esc(person(x.owner).name)}</small></div></button>`).join('')}</div>
    <div class="sec-t" style="font-size:20px">Collections</div>
    <div class="fgrid">${S.folders.map(fo=>{const c=FC[fo.c]||FC.flora;const n=S.files.filter(x=>x.folder===fo.id).length;return `<a class="folder" href="#/library/${fo.id}" style="text-decoration:none"><span class="fc">${n} file${n===1?'':'s'}</span><span class="ic" style="background:${c[0]};color:${c[1]}">${ic(fo.icon)}</span><b>${esc(fo.name)}</b><small>${esc(fo.desc)}</small></a>`}).join('')}</div>`
  :`<div class="card" style="overflow:auto">${list.length?fileTable(list,true,!f):'<div class="empty"><b>No files match</b>Try a different search or filter.</div>'}</div>
    <p class="muted" style="margin-top:10px;font-size:14px">${list.length} file${list.length===1?'':'s'} · ${sizeFmt(list.reduce((a,x)=>a+x.size,0))}</p>`}`;
  const dz=$('#dz');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');addFiles(e.dataTransfer.files,f?f.id:null)});
  $('#libQ').addEventListener('input',e=>{libQ=e.target.value;const pos=e.target.selectionStart;vLibrary(folderId);const el=$('#libQ');el.focus();el.setSelectionRange(pos,pos)});
  $('#libType').onchange=e=>{libType=e.target.value;vLibrary(folderId)};
  $('#libStatus').onchange=e=>{libStatus=e.target.value;vLibrary(folderId)};
  $('#libSort').onchange=e=>{libSort=e.target.value;vLibrary(folderId)};
}
function typeGroup(n){const e=ext(n);return ['pdf','docx','doc','txt','md'].includes(e)?'doc':['pptx','key'].includes(e)?'deck':['xlsx','csv'].includes(e)?'sheet':['png','jpg','jpeg','svg','gif','psd','fig','indd','ai'].includes(e)?'image':['zip'].includes(e)?'archive':'other'}
function fileTable(list,full=true,showFolder=true){
  return `<table class="ptable"><thead><tr>${full?'<th style="width:40px"><span class="sr">Star</span></th>':''}<th>Name</th>${full&&showFolder?'<th>Collection</th>':''}<th>Status</th>${full?'<th>Owner</th><th>Size</th>':''}<th>Updated</th></tr></thead><tbody>
  ${list.map(x=>`<tr data-file="${x.id}">${full?`<td><button class="starbtn" aria-pressed="${x.fav}" aria-label="Star ${esc(x.name)}" data-fav="${x.id}">${ic('star')}</button></td>`:''}
    <td><div class="fname">${ftype(x.name)}<div><b>${esc(x.name)}</b><small>v${x.ver} · ${x.tags.map(esc).join(', ')}</small></div></div></td>
    ${full&&showFolder?`<td>${esc(folderById(x.folder)?.name||'')}</td>`:''}<td>${fileStatus(x.status)}</td>${full?`<td>${esc(person(x.owner).name)}</td><td>${sizeFmt(x.size)}</td>`:''}<td>${fmt(x.updated)}</td></tr>`).join('')}
  </tbody></table>`;
}
const blobs={};
function addFiles(fl,folder){
  if(!fl||!fl.length)return;
  if(!folder){chooseFolder(fl);return}
  [...fl].forEach(file=>{const id=uid();if(file.type.startsWith('image/'))blobs[id]=URL.createObjectURL(file);
    S.files.push({id,name:file.name,folder,size:file.size||1000,owner:'me',updated:rel(0),status:'Draft',tags:['uploaded'],ver:1,fav:false});
    logAct('me','uploaded',file.name)});
  save();route();toast(`${fl.length} file${fl.length>1?'s':''} added to ${folderById(folder).name}`);
}

  openModal('Choose a collection',`<label>Upload ${fl.length} file${fl.length>1?'s':''} to<select class="field sq" name="folder">${S.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>`,'Upload',fd=>addFiles(fl,fd.get('folder')));

const GUIDES=[
 {id:'voice',t:'Voice & tone',cat:'Writing',min:3,d:'Direct and declarative, first-person plural. State a belief, then back it with action.',
  b:`<h2>How we sound</h2><p>Direct and declarative, first-person plural. State a belief, then back it with concrete actions. Sentence case in body copy; title case for value headers. No emoji, no hedging, no corporate throat-clearing.</p><p>Closer to a cultural organization's mission statement than a tech product's marketing voice: confident, unembellished, civic.</p><blockquote>"We build community through collaboration."</blockquote><h2>Rewrites partners can copy</h2><table><tr><th>Instead of</th><th>Write</th></tr><tr><td>We're super excited to leverage our platform to empower diverse creatives!</td><td>We build space for Black designers to lead. This year, that means a main stage led by them.</td></tr><tr><td>SoBD is kind of hoping to maybe partner with brands that care about equity.</td><td>We partner with organizations that show real commitment to Black communities.</td></tr><tr><td>Our Synergistic Solutions Drive Inclusive Innovation Outcomes</td><td>Design shapes culture. We make sure Black designers shape it too.</td></tr></table><h2>Word list</h2><p><b>Use:</b> build, create, lead, community, legacy, space, collaboration.</p><p><b>Avoid:</b> leverage, synergy, "diverse" as a stand-in for Black, empower (as something done to people).</p>`},
 {id:'naming',t:'Naming & writing',cat:'Writing',min:2,d:'One name, written one way, everywhere.',
  b:`<h2>One name, one way</h2><table><tr><th>Use</th><th>Write it like this</th><th>Not like this</th></tr><tr><td>Full name</td><td>State of Black Design</td><td>State Of Black Design · Black Design</td></tr><tr><td>First mention</td><td>the State of Black Design (SoBD)</td><td>SOBD (State of Black Design)</td></tr><tr><td>After that</td><td>SoBD</td><td>SOBD · Sobd · S.O.B.D.</td></tr><tr><td>Events</td><td>SoBD 2026 Conference: Still Tippin'</td><td>Still Tippin' Conference (name missing)</td></tr><tr><td>Email &amp; web</td><td>info@thesobd.com</td><td>Info@TheSoBD.com</td></tr></table><p>Capital "The" only at the start of a sentence. Keep the apostrophe in theme names (Tippin'); it's part of the voice.</p>`},
 {id:'hierarchy',t:'Message hierarchy',cat:'Writing',min:2,d:'Three levels of message. Use no more than two in one piece.',
  b:`<h2>Three levels</h2><p><b>1 · Master slogan (permanent).</b> Elevating Black Voices. Creating Opportunities. Leading Change. Use in closings, About sections, sponsor decks and merch.</p><p><b>2 · Brand line (evergreen).</b> Design Shapes Culture. Use in social bios, email signatures and short sign-offs.</p><p><b>3 · Annual theme (changes every year).</b> Event title and campaign graphics. Always paired with "State of Black Design" and the year; it never replaces the name.</p><p>When a year has more than one event, each event keeps its own theme and names its city or host.</p>`},
 {id:'boiler',t:'About SoBD: boilerplate',cat:'Press',min:2,d:'Copy these exactly. Pick the length that fits.',
  b:`<h2>25 words · social bios, event listings</h2><p>The State of Black Design (SoBD) is a conference and career community for Black designers, educators, and students. More than 10,000 people have joined since 2020.</p><h2>50 words · sponsor decks, partner sites</h2><p>Founded in 2020, the State of Black Design (SoBD) creates real, intentional space for Black designers and those who support them. Through conferences, career fairs, and community programs, SoBD connects emerging creatives with accomplished Black designers and the organizations hiring them. More than 10,000 people have taken part.</p><h2>Notes</h2><p>The 100-word version for press releases and grant applications lives in <a class="link" href="#/library/press">Press &amp; Boilerplate</a>. Update the 10,000 figure each year.</p>`},
 {id:'cobrand',t:'Partner co-branding',cat:'Partners',min:3,d:'Side by side, equal weight, a clear line between us.',
  b:`<h2>The rules</h2><ul><li><b>Equal weight.</b> Logos sit at the same visual height. The partner mark never outsizes ours on a SoBD piece.</li><li><b>Clear space.</b> Twice the height of the "S" between the two marks, with a 1 pt Blackish divider.</li><li><b>Right words.</b> "Presented by," "In partnership with," or "Sponsored by." SoBD doesn't endorse products.</li><li><b>One color on photos.</b> On photos or color grounds, both marks go single-color on a solid plate.</li></ul><p>Every co-branded piece is reviewed by SoBD before release. Submit it in <a class="link" href="#/approvals">Brand Approvals</a>.</p>`},
 {id:'sponsor',t:'Sponsor recognition tiers',cat:'Partners',min:2,d:'Bigger commitment, bigger presence: set by tier, not by request.',
  b:`<table><tr><th>Tier</th><th>Logo size</th><th>Placement</th></tr><tr><td>Presenting partner</td><td>100% of SoBD logo height</td><td>"Presented by" lockup, event title graphics, stage screens, press release, opening remarks</td></tr><tr><td>Supporting partner</td><td>60%</td><td>Sponsor wall and slide, event web page, grouped thank-you post</td></tr><tr><td>Community partner</td><td>40%</td><td>Sponsor wall and slide, event web page name listing</td></tr></table><p class="muted">Proposed in v2. Tier names and pricing still need approval; see the 2027 Sponsor Program project.</p>`},
 {id:'color',t:'Color & type quick reference',cat:'Design',min:2,d:'The palette, pairings and web font fallbacks in one place.',
  b:`<h2>Palette</h2><table><tr><th>Color</th><th>Hex</th><th>Use</th></tr><tr><td><span class="sw" style="background:#C2431A"></span>Eartha</td><td>#C2431A</td><td>Primary accent, CTAs, headlines</td></tr><tr><td><span class="sw" style="background:#9C3615"></span>Eartha Dark</td><td>#9C3615</td><td>Hover / pressed state</td></tr><tr><td><span class="sw" style="background:#B98B1E"></span>Golden</td><td>#B98B1E</td><td>Shape color. Golden type only on Blackish</td></tr><tr><td><span class="sw" style="background:#34461D"></span>Flora</td><td>#34461D</td><td>Tertiary accent, grounding color</td></tr><tr><td><span class="sw" style="background:#1A1A1A"></span>Blackish</td><td>#1A1A1A</td><td>Text, dark surfaces</td></tr><tr><td><span class="sw" style="background:#F6F2E0"></span>Yella</td><td>#F6F2E0</td><td>Primary background</td></tr></table><p>Typical mix: 55% Yella/White, 20% Blackish, 15% Eartha, 5% Golden, 5% Flora. No blues or purples, no gradients.</p><h2>Web fallbacks</h2><table><tr><th>Role</th><th>Brand font</th><th>Fallback</th></tr><tr><td>Logo, hero statements</td><td>Bayard</td><td>Bebas Neue</td></tr><tr><td>Display headlines, buttons</td><td>Blacker Display</td><td>Playfair Display</td></tr><tr><td>Body copy</td><td>Blacker Text</td><td>Source Serif 4</td></tr></table>`},
 {id:'a11y',t:'Accessibility basics',cat:'Design',min:2,d:"If people can't read it, we haven't centered them.",
  b:`<ul><li><b>Contrast.</b> Body text needs 4.5:1 or more. Follow the color pairings chart.</li><li><b>Type size.</b> Body copy at least 16 px on screen, 11 pt in print.</li><li><b>Alt text.</b> Describe who is doing what. Name speakers. Skip "image of."</li><li><b>Captions.</b> Every video, reel and live stream. Check auto-captions for names.</li><li><b>Text on photos.</b> Always on a solid plate.</li><li><b>Color + label.</b> Never use color alone to carry meaning.</li></ul>`},
 {id:'social',t:'Social media',cat:'Comms',min:2,d:'One handle, one way to tag, a short list of hashtags.',
  b:`<ul><li>Instagram: @stateofblackdesigntx. Profile image is the full-color monogram on Yella.</li><li>Bio names the next event; update it the week the last one ends.</li><li>Partners tag the account in the post, not only the caption. Use Instagram Collab for co-presented posts.</li><li>#StateOfBlackDesign on every post, #SoBD plus the year, and the event tag (e.g. #StakesIsHigh). Three or fewer.</li><li>No emoji in captions. Alt text on every image. Credit photographers.</li></ul>`},
 {id:'working',t:'Working with SoBD',cat:'Partners',min:2,d:'Get the files, get a yes, use the name right.',
  b:`<h2>1 · Get the files</h2><p>The logo pack (SVG, PNG and EPS for every variation) and templates live in the <a class="link" href="#/library/brand">Brand &amp; Logo Pack</a> and <a class="link" href="#/library/tmpl">Templates</a> collections. Partners request access at info@thesobd.com.</p><h2>2 · Get a yes</h2><p><b>Pre-approved:</b> logo pack files used unaltered and the master slogan.</p><p><b>Needs review:</b> co-branded pieces, merch, press releases, annual-theme graphics. Allow 5 business days.</p><h2>3 · Use the name right</h2><p>The State of Black Design name, the SoBD monogram and all logos belong to SoBD. Use them only for approved collaborations.</p>`}
];

function bizDaysLeft(sub){let d=parse(sub),n=0;while(n<5){d=new Date(d.getTime()+DAY);if(d.getDay()%6)n++}return {due:d,left:Math.round((d-TODAY)/DAY)}}
function vApprovals(){
  pageHead('Operations','Brand Approvals','',`<button class="btn btn-y" data-act="newApproval">${ic('plus')}Submit a piece</button>`);
  const groups=[['pending','Waiting for review'],['changes','Changes requested'],['approved','Approved']];
  $('#view').innerHTML=`<p style="margin-bottom:18px;max-width:760px">Co-branded pieces, merch, press releases and annual-theme graphics need a yes before release. Logo pack files used unaltered and the master slogan are pre-approved. Target turnaround is 5 business days.</p>
  ${groups.map(([k,l])=>{const it=S.approvals.filter(a=>a.state===k);return `<section class="card" style="margin-bottom:22px"><div class="card-h"><h2>${l}</h2><span class="pill ${k==='pending'?'e':k==='changes'?'g':'f'}">${it.length}</span></div>
    ${it.length?it.map(a=>{const b=bizDaysLeft(a.sub);return `<div class="ap-row"><div><b>${esc(a.title)}</b><small>${esc(a.who)} · submitted ${fmt(a.sub)}</small></div><div><span class="pill n">${esc(a.type)}</span></div>
    <div class="sla">${k==='approved'?'<span class="pill f">✓ Cleared</span>':k==='changes'?'With submitter':b.left<0?`<span class="overdue">${-b.left}d past target</span>`:b.left===0?'<span class="overdue">Due today</span>':`Due ${fmt(b.due.toISOString().slice(0,10))} · ${b.left}d`}</div>
    <div class="ap-acts">${k==='approved'?`<button class="btn btn-o btn-s" data-ap="${a.id}|pending">Reopen</button>`:`<button class="btn btn-p btn-s" data-ap="${a.id}|approved">${ic('check')}Approve</button><button class="btn btn-o btn-s" data-ap="${a.id}|changes">Request changes</button>`}</div></div>`}).join(''):'<div class="empty">Nothing here.</div>'}</section>`}).join('')}`;
}

/* ============ CALENDAR ============ */
let calM=null;
function vCalendar(){
  if(!calM)calM=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  const label=calM.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  pageHead('Operations','Calendar','',`<button class="btn btn-y btn-s" data-cal="-1" aria-label="Previous month">← Prev</button><button class="btn btn-y btn-s" data-cal="0">Today</button><button class="btn btn-y btn-s" data-cal="1" aria-label="Next month">Next →</button>`);
  const ev=[];
  S.projects.forEach(p=>{p.milestones.forEach(m=>ev.push({d:m.d,t:'◆ '+m.t,c:PCOL[p.color],href:'#/projects/'+p.id}));p.tasks.filter(t=>t.status!=='done').forEach(t=>ev.push({d:t.due,t:t.title,c:PCOL[p.color],href:'#/projects/'+p.id,task:1}))});
  ['2027-02-18','2027-02-19','2027-02-20'].forEach((d,i)=>!ev.some(e=>e.d===d&&/Stakes Is High/.test(e.t))&&ev.push({d,t:'Stakes Is High · Day '+(i+1),c:'#C2431A',href:'#/projects/sih27',big:1}));
  const first=new Date(calM), start=new Date(first.getTime()-first.getDay()*DAY);
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const es=ev.filter(e=>e.d===iso).sort((a,b)=>(b.big||0)-(a.big||0)||(a.task||0)-(b.task||0));
    cells+=`<div class="day ${d.getMonth()!==calM.getMonth()?'out':''} ${d.getTime()===TODAY.getTime()?'today':''}"><span class="dn">${d.getDate()}</span>${es.slice(0,3).map(e=>`<a class="ev" href="${e.href}" style="border-color:${e.c};background:${e.big?'#F3D9CF':'#F6F2E0'};text-decoration:none;color:#1A1A1A" title="${esc(e.t)}">${esc(e.t)}</a>`).join('')}${es.length>3?`<small class="muted">+${es.length-3} more</small>`:''}</div>`}
  $('#view').innerHTML=`<div class="sec-t">${label}<span class="muted" style="font-family:var(--text);font-weight:400;font-size:15px">◆ milestone · bar color = project</span></div>
    <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:14px">${S.projects.map(p=>`<span><span class="sw" style="background:${PCOL[p.color]};width:12px;height:12px"></span>${esc(p.name)}</span>`).join('')}</div>`;
}

/* ============ modals / drawers ============ */
let modalSubmit=null;
function openModal(title,fields,cta,onSubmit){
  modalSubmit=onSubmit;
  $('#modal').innerHTML=`<div class="mh"><h3 id="mt">${title}</h3><button class="closebtn" data-close aria-label="Close">${ic('x')}</button></div><form id="mform">${fields}<div class="acts"><button type="button" class="btn btn-o" data-close>Cancel</button><button class="btn btn-p">${cta}</button></div></form>`;
  $('#modal').setAttribute('aria-labelledby','mt');
  $('#modal').classList.add('on');$('#scrim').classList.add('on');
  setTimeout(()=>{const f=$('#mform input,#mform select,#mform textarea');f&&f.focus()},30);
  $('#mform').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);closeAll();modalSubmit&&modalSubmit(fd)};
}
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('on');$('#scrim').classList.add('on');setTimeout(()=>$('#drawer .closebtn')?.focus(),50)}
function closeAll(){$('#modal').classList.remove('on');$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#side').classList.remove('on');$('#notif').classList.remove('on');$('#gres').classList.remove('on')}
const teamOpts=sel=>[...TEAM,{id:'me',name:S.me.name+' (you)'}].map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('');
function taskModal(pid,tid,st){
  const p=S.projects.find(x=>x.id===pid); const t=tid?p.tasks.find(x=>x.id===tid):{title:'',status:st||'todo',who:p.lead,due:rel(7),tag:'Program',pri:'Normal',notes:''};
  openModal(tid?'Edit task':'New task',`
   <label>Task<input class="field sq" name="title" required value="${esc(t.title)}" placeholder="What needs to happen?"></label>
   <div class="row2"><label>Owner<select class="field sq" name="who">${teamOpts(t.who)}</select></label><label>Due<input class="field sq" type="date" name="due" value="${t.due}" required></label></div>
   <div class="row2"><label>Status<select class="field sq" name="status">${STATUS.map(([k,l])=>`<option value="${k}" ${k===t.status?'selected':''}>${l}</option>`).join('')}</select></label><label>Priority<select class="field sq" name="pri">${['Normal','High'].map(x=>`<option ${x===t.pri?'selected':''}>${x}</option>`).join('')}</select></label></div>
   <label>Tag<select class="field sq" name="tag">${['Program','Design','Comms','Partners','Logistics','Finance'].map(x=>`<option ${x===t.tag?'selected':''}>${x}</option>`).join('')}</select></label>
   <label>Notes<textarea class="field sq" name="notes" rows="3">${esc(t.notes||'')}</textarea></label>
   ${tid?`<button type="button" class="link" style="justify-self:start;color:var(--eartha-dk)" data-deltask="${pid}|${tid}">${ic('trash')}Delete task</button>`:''}`,
   tid?'Save task':'Add task',fd=>{
    const o={title:fd.get('title').trim(),who:fd.get('who'),due:fd.get('due'),status:fd.get('status'),pri:fd.get('pri'),tag:fd.get('tag'),notes:fd.get('notes')};
    if(tid)Object.assign(t,o);else{p.tasks.push({id:uid(),...o});logAct('me','added a task to '+p.name+':',o.title)}
    save();route();toast(tid?'Task saved':'Task added')});
}

/* ============ global events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,a,tr'); if(!el)return;
  const d=el.dataset;
  if(d.close!==undefined){closeAll();return}
  if(d.upload){e.preventDefault();$('#fileInput').dataset.folder='';$('#fileInput').click();return}
  if(d.toggle){e.stopPropagation();const [pid,tid]=d.toggle.split('|');const t=S.projects.find(p=>p.id===pid).tasks.find(x=>x.id===tid);t.status=t.status==='done'?'todo':'done';if(t.status==='done')logAct('me','completed',t.title);save();route();toast(t.status==='done'?'Task completed':'Task reopened');return}
  if(d.fav){e.stopPropagation();const f=S.files.find(x=>x.id===d.fav);f.fav=!f.fav;save();route();return}
  if(d.file&&!e.target.closest('[data-fav]')){fileDrawer(d.file);return}
  if(d.task){const [pid,tid]=d.task.split('|');taskModal(pid,tid);return}
  if(d.href){location.hash=d.href;return}
  if(d.pv){pView=d.pv;route();return}
  if(d.lv){libView=d.lv;route();return}
  if(d.ptab){pTab=d.ptab;route();return}
  if(d.gcat){gCat=d.gcat;route();return}
  if(d.cal!==undefined){const n=+d.cal;calM=n===0?new Date(TODAY.getFullYear(),TODAY.getMonth(),1):new Date(calM.getFullYear(),calM.getMonth()+n,1);route();return}
  if(d.ms){const [pid,i]=d.ms.split('|');const m=S.projects.find(p=>p.id===pid).milestones[i];m.done=!m.done;save();route();return}
  if(d.ap){const [id,st]=d.ap.split('|');const a=S.approvals.find(x=>x.id===id);a.state=st;logAct('me',st==='approved'?'approved':st==='changes'?'requested changes on':'reopened',a.title);save();route();toast(st==='approved'?'Approved':'Updated');return}
  if(d.deltask){const [pid,tid]=d.deltask.split('|');const p=S.projects.find(x=>x.id===pid);p.tasks=p.tasks.filter(t=>t.id!==tid);closeAll();save();route();toast('Task deleted');return}
  if(d.dl){toast('Download starts in the full app');return}
  if(d.copylink){const f=S.files.find(x=>x.id===d.copylink);try{navigator.clipboard.writeText(location.href.split('#')[0]+'#/library/'+f.folder)}catch(_){};toast('Link copied');return}
  if(d.favd){const f=S.files.find(x=>x.id===d.favd);f.fav=!f.fav;save();fileDrawer(f.id);route();return}
  if(d.del){const f=S.files.find(x=>x.id===d.del);S.files=S.files.filter(x=>x.id!==d.del);logAct('me','deleted',f.name);closeAll();save();route();toast('File deleted');return}
  if(d.addtag){const f=S.files.find(x=>x.id===d.addtag);openModal('Add a tag',`<label>Tag<input class="field sq" name="tag" required></label>`,'Add',fd=>{f.tags.push(fd.get('tag').trim());save();fileDrawer(f.id)});return}
  if(d.act){e.preventDefault();act(d.act,d)}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.pstatus){S.projects.find(p=>p.id===d.pstatus).status=e.target.value;save();route();toast('Status updated')}
  if(d.fstatus){const f=S.files.find(x=>x.id===d.fstatus);f.status=e.target.value;save();route();fileDrawer(f.id);toast('File status updated')}
  if(d.fmove){const f=S.files.find(x=>x.id===d.fmove);f.folder=e.target.value;save();route();fileDrawer(f.id);toast('Moved to '+folderById(f.folder).name)}
});
function act(a,d){
  if(a==='upload'){const m=location.hash.match(/#\/library\/(\w+)/);$('#fileInput').dataset.folder=m?m[1]:'';$('#fileInput').click()}
  if(a==='newTask')taskModal(d.pid,null,d.st);
  if(a==='newProject')openModal('New project',`<label>Project name<input class="field sq" name="name" required placeholder="e.g. SoBD Community Reads: Spring Series"></label><label>Description<textarea class="field sq" name="desc" rows="3"></textarea></label>
    <div class="row2"><label>Lead<select class="field sq" name="lead">${teamOpts('ab')}</select></label><label>Color<select class="field sq" name="color"><option value="eartha">Eartha</option><option value="golden">Golden</option><option value="flora">Flora</option><option value="blackish">Blackish</option></select></label></div>
    <div class="row2"><label>Start<input class="field sq" type="date" name="start" value="${rel(0)}"></label><label>End<input class="field sq" type="date" name="end" value="${rel(60)}"></label></div>
    <label>Linked collection<select class="field sq" name="folder">${S.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>`,'Create project',fd=>{
      const id=uid();S.projects.push({id,name:fd.get('name').trim(),desc:fd.get('desc').trim()||'New project.',lead:fd.get('lead'),color:fd.get('color'),status:'On track',start:fd.get('start'),end:fd.get('end'),folder:fd.get('folder'),milestones:[],tasks:[]});
      logAct('me','created the project',fd.get('name'));save();location.hash='#/projects/'+id;toast('Project created')});
  if(a==='newMs')openModal('New milestone',`<label>Milestone<input class="field sq" name="t" required></label><label>Date<input class="field sq" type="date" name="d" value="${rel(14)}" required></label>`,'Add milestone',fd=>{const p=S.projects.find(x=>x.id===d.pid);p.milestones.push({t:fd.get('t').trim(),d:fd.get('d'),done:false});p.milestones.sort((a,b)=>a.d.localeCompare(b.d));save();route();toast('Milestone added')});
  if(a==='newFolder')openModal('New collection',`<label>Name<input class="field sq" name="name" required></label><label>Description<input class="field sq" name="desc"></label><label>Accent<select class="field sq" name="c"><option value="eartha">Eartha</option><option value="golden">Golden</option><option value="flora">Flora</option></select></label>`,'Create',fd=>{S.folders.push({id:uid(),name:fd.get('name').trim(),desc:fd.get('desc').trim(),icon:'folder',c:fd.get('c')});save();route();toast('Collection created')});
  if(a==='newApproval')openModal('Submit for brand review',`<label>What is it?<input class="field sq" name="title" required placeholder="e.g. Co-branded flyer with partner"></label><div class="row2"><label>Submitted by<input class="field sq" name="who" required placeholder="Partner or team"></label><label>Type<select class="field sq" name="type"><option>Co-branded piece</option><option>Merch</option><option>Press release</option><option>Annual-theme graphic</option></select></label></div>`,'Submit',fd=>{S.approvals.unshift({id:uid(),title:fd.get('title').trim(),who:fd.get('who').trim(),type:fd.get('type'),sub:rel(0),state:'pending'});logAct('me','submitted for review',fd.get('title'));save();route();toast('Submitted. Review due in 5 business days')});
  if(a==='reset'){try{localStorage.removeItem(KEY)}catch(_){};load();route();toast('Demo data reset')}
}
const curFolder=()=>{const m=location.hash.match(/#\/library\/(\w+)/);return m&&folderById(m[1])?m[1]:null};
$('#fileInput').addEventListener('change',e=>{addFiles(e.target.files,e.target.dataset.folder||curFolder());e.target.value=''});
$('#scrim').onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();$('#gres').classList.remove('on')}});
$('#menuBtn').onclick=()=>{$('#side').classList.add('on');$('#scrim').classList.add('on')};
$('#bellBtn').onclick=e=>{e.stopPropagation();$('#notif').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#notif,#bellBtn'))$('#notif').classList.remove('on');if(!e.target.closest('.gsearch'))$('#gres').classList.remove('on')});

/* global search */
$('#gq').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase(), box=$('#gres');
  if(q.length<2){box.classList.remove('on');return}
  const m=s=>s.toLowerCase().includes(q);
  const ps=S.projects.filter(p=>m(p.name)||m(p.desc)).slice(0,3);
  const ts=allTasks().filter(t=>m(t.title)).slice(0,4);
  const fs=S.files.filter(f=>m(f.name)||f.tags.some(m)).slice(0,5);
  const gs=GUIDES.filter(g=>m(g.t)||m(g.d)||m(g.b.replace(/<[^>]+>/g,''))).slice(0,3);
  const sec=(l,arr,fn)=>arr.length?`<div class="grp">${l}</div>`+arr.map(fn).join(''):'';
  box.innerHTML=sec('Projects',ps,p=>`<button data-go="#/projects/${p.id}">${ic('kanban')}<span>${esc(p.name)}<small>${esc(p.status)}</small></span></button>`)+
    sec('Tasks',ts,t=>`<button data-go="#/projects/${t.pid}">${ic('check')}<span>${esc(t.title)}<small>${esc(t.pname)}</small></span></button>`)+
    sec('Files',fs,f=>`<button data-gofile="${f.id}">${ic('file')}<span>${esc(f.name)}<small>${esc(folderById(f.folder)?.name||'')}</small></span></button>`)+
    sec('Guides',gs,g=>`<button data-go="#/guides/${g.id}">${ic('book')}<span>${esc(g.t)}<small>${esc(g.cat)}</small></span></button>`)||'<div class="empty">No matches</div>';
  box.classList.add('on');
});
$('#gres').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#gres').classList.remove('on');$('#gq').value='';if(b.dataset.go)location.hash=b.dataset.go;if(b.dataset.gofile){const f=S.files.find(x=>x.id===b.dataset.gofile);location.hash='#/library/'+f.folder;setTimeout(()=>fileDrawer(f.id),60)}});

/* ============ router ============ */
const PAGE='guides';
const FILES={"overview": "SoBD-Back-Office-01-Overview.html", "projects": "SoBD-Back-Office-02-Projects.html", "library": "SoBD-Back-Office-03-Knowledge-Library.html", "guides": "SoBD-Back-Office-04-Guides.html", "approvals": "SoBD-Back-Office-05-Brand-Approvals.html", "calendar": "SoBD-Back-Office-06-Calendar.html", "team": "SoBD-Back-Office-07-Team.html", "account": "SoBD-Back-Office-08-My-Account.html"};
function route(){
  const parts=(location.hash.replace(/^#\/?/,'')||PAGE).split('/');
  const r=FILES[parts[0]]?parts[0]:PAGE;
  if(r!==PAGE){location.href=FILES[r]+location.hash;return}
  renderChrome(r);
  ({overview:vOverview,projects:()=>parts[1]?vProject(parts[1]):vProjects(),library:()=>vLibrary(parts[1]),guides:()=>vGuides(parts[1]),approvals:vApprovals,calendar:vCalendar,team:vTeam,account:vAccount}[r]||vOverview)();
}
let lastRoute='';
window.addEventListener('hashchange',()=>{const h=location.hash;if(h.split('/').slice(0,2).join('/')!==lastRoute.split('/').slice(0,2).join('/')){pTab='board'}lastRoute=h;closeAll();route();window.scrollTo(0,0);$('#view').focus({preventScroll:true})});
load(); route();
</script>
